<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="BrandBay: one portal for a brand's marketing, social media managers and influencer shoots.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23D63A6E'/%3E%3Ctext x='16' y='22' font-size='16' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<title>BrandBay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:system-ui,sans-serif}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: sticky top bar; logged-in app = left sidebar nav + main work column; collapses to a scrolling tab strip on phones */
:root{
  --bg:#F5F5F9; --surface:#FFFFFF; --sunk:#ECECF3; --ink:#17152B; --muted:#5F5C78; --line:#DCDBE7;
  --accent:#D63A6E; --accent-ink:#FFFFFF; --accent-soft:#FBE3EC;
  --violet:#5B44C9; --violet-soft:#E8E4FA;
  --ok:#1D8A5B; --ok-soft:#DDF3E8; --warn:#B26A00; --warn-soft:#FBEFD9; --info:#2363B8; --info-soft:#E0ECFA; --bad:#C0392B; --bad-soft:#FBE4E1;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121120; --surface:#1B1A2C; --sunk:#242338; --ink:#EEEDF7; --muted:#A3A0BE; --line:#33314A;
  --accent:#F0679A; --accent-ink:#1A0B12; --accent-soft:#3D1D2B; --violet:#A797FF; --violet-soft:#2B2650;
  --ok:#5BD39B; --ok-soft:#173527; --warn:#F2B259; --warn-soft:#3A2B12; --info:#7FB2F5; --info-soft:#18294A; --bad:#FF8A7A; --bad-soft:#3E1C19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121120; --surface:#1B1A2C; --sunk:#242338; --ink:#EEEDF7; --muted:#A3A0BE; --line:#33314A;
  --accent:#F0679A; --accent-ink:#1A0B12; --accent-soft:#3D1D2B; --violet:#A797FF; --violet-soft:#2B2650;
  --ok:#5BD39B; --ok-soft:#173527; --warn:#F2B259; --warn-soft:#3A2B12; --info:#7FB2F5; --info-soft:#18294A; --bad:#FF8A7A; --bad-soft:#3E1C19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)} .mono{font-family:var(--mono);font-size:12px} .num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.logo{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer;flex:none}
.logo i{width:26px;height:26px;border-radius:8px;background:conic-gradient(from 200deg,var(--accent),var(--violet),var(--accent));display:inline-block}
.spacer{flex:1}
.search{position:relative;flex:1;max-width:380px;min-width:0}
.search input{width:100%;background:var(--sunk);border:1px solid transparent;border-radius:10px;padding:8px 12px}
.search input:focus{border-color:var(--line);background:var(--surface)}
.pop{position:absolute;top:calc(100% + 6px);right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(20,15,40,.14);z-index:9;min-width:300px;max-width:calc(100vw - 32px);max-height:420px;overflow:auto;padding:6px}
.search .pop{left:0;right:auto;width:100%}
.pop button.res{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;cursor:pointer}
.pop button.res:hover{background:var(--sunk)}
.pop .hdr{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px 4px}
.iconbtn{position:relative;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.8}
.dot{position:absolute;top:-5px;right:-5px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.relwrap{position:relative;flex:none}
.notif{padding:10px;border-radius:8px;display:grid;gap:2px;cursor:pointer;background:none;border:0;text-align:left;width:100%}
.notif:hover{background:var(--sunk)}
.notif.unread{background:var(--accent-soft)}
.notif small{color:var(--muted);font-size:12px}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--violet));flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;border:0;cursor:pointer}
.av.lg{width:52px;height:52px;font-size:17px;cursor:default}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:transparent}
.btn.okb{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.btn.badb{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* home */
.hero{padding-block:56px 32px;display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(34px,5.4vw,60px);font-weight:800;letter-spacing:-.03em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{color:var(--muted);font-size:18px;max-width:52ch;margin:18px 0 26px}
.ctas{display:flex;gap:10px;flex-wrap:wrap}
.phone{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:12px;max-width:380px;justify-self:end;width:100%}
.row{display:flex;align-items:center;gap:10px}
.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.grid9 span{aspect-ratio:1;border-radius:6px;background:var(--sunk)}
.grid9 span:nth-child(3n+1){background:var(--accent-soft)} .grid9 span:nth-child(4n){background:var(--violet-soft)}
.metric{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.metric b{font-family:var(--mono);color:var(--ink);font-weight:500}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-block:12px 40px}
.role{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:10px}
.role h3{font-size:22px}
.role p{color:var(--muted);flex:1}
.role ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;width:max-content;white-space:nowrap}
.t-biz{background:var(--accent-soft);color:var(--accent)} .t-pro{background:var(--violet-soft);color:var(--violet)} .t-emp{background:var(--info-soft);color:var(--info)}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding-block:12px 40px}
.flow div{border-top:2px solid var(--line);padding-top:12px}
.flow b{display:block;font-family:var(--display);font-size:17px}
.flow span{color:var(--muted);font-size:14px}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-block:12px 64px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:8px;align-content:start}
.plan.feat{border-color:var(--accent)}
.plan .price{font-family:var(--display);font-size:30px;font-weight:800}
.plan .price small{font-size:14px;color:var(--muted);font-weight:500;font-family:var(--body)}
.plan ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}

/* forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.auth{max-width:580px;margin:40px auto 64px}
.auth h2{font-size:30px;margin-bottom:6px}
.sub{color:var(--muted);margin:0 0 20px}
.field{display:grid;gap:6px;margin-bottom:14px;min-width:0}
.field>label,.flabel{font-size:13px;font-weight:600}
.field input:not([type=checkbox]):not([type=radio]):not([type=color]),.field select,.field textarea,.inp{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.field textarea,textarea.inp{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.pick label{border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;font-weight:600;font-size:14px;display:grid;gap:2px;position:relative}
.pick label small{font-weight:400;color:var(--muted);font-size:12px}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.pick label:has(input:focus-visible){outline:2px solid var(--accent)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.checks label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.err{color:var(--bad);font-size:13px;min-height:18px}
.demo-accts{display:grid;gap:8px}
.demo-accts button{display:flex;align-items:center;gap:10px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.demo-accts button:hover{border-color:var(--accent)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

/* app shell */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;padding-block:24px 64px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:grid;gap:2px}
.side .me{display:flex;gap:10px;align-items:center;padding:6px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.side .me b{display:block;font-size:14px;line-height:1.2}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;background:none;border:0;border-radius:10px;padding:9px 12px;font-weight:600;color:var(--muted);cursor:pointer;text-align:left;width:100%}
.nav:hover{background:var(--sunk);color:var(--ink)}
.nav[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nav .cnt{font-size:11px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 7px}
.main{display:grid;gap:20px;min-width:0}
.dhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dhead h2{font-size:28px;letter-spacing:-.02em}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.stat small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.stat b{display:block;font-family:var(--mono);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums;margin-top:4px;overflow-wrap:anywhere}
.stat span{font-size:12px;color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.card h3{font-size:18px;margin-bottom:14px}
.card .chead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card .chead h3{margin:0}
.list{display:grid;gap:10px}
.item{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;background:var(--bg);min-width:0}
.item.click{cursor:pointer}
.item.click:hover{border-color:var(--muted)}
.hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.meta{font-size:13px;color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.status{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.s-Submitted,.s-Pending,.s-Due,.s-Unverified{background:var(--warn-soft);color:var(--warn)}
.s-Research,.s-Content,.s-Scheduled{background:var(--info-soft);color:var(--info)}
.s-Live,.s-Approved,.s-Paid,.s-Active,.s-Posted{background:var(--ok-soft);color:var(--ok)}
.s-Changes,.s-Suspended,.s-Overdue{background:var(--bad-soft);color:var(--bad)}
.pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.pipe span{height:5px;border-radius:3px;background:var(--line)}
.pipe span.on{background:var(--accent)}
.pipe-l{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:11px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions select,.tsel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px;max-width:100%}
.empty{color:var(--muted);font-size:14px;padding:22px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.linkbtn{background:none;border:0;padding:0;font-weight:700;cursor:pointer;text-align:left;color:var(--ink)}
.linkbtn:hover{color:var(--accent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .inp{width:auto;flex:1;min-width:160px;padding:8px 12px}
.toolbar select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100vw - 32px)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.kv div{display:grid;gap:2px}
.kv small{font-size:12px;color:var(--muted);font-weight:600}
.stars{color:var(--warn);letter-spacing:1px}
.starpick{display:flex;gap:4px}
.starpick button{background:none;border:0;font-size:24px;cursor:pointer;color:var(--line);padding:0 2px}
.starpick button.on{color:var(--warn)}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 72px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:5px}
.bar b{font-family:var(--mono);font-weight:500;text-align:right;font-size:12px}
.chart svg{width:100%;height:auto;display:block}
.score{font-family:var(--mono);font-size:12px;font-weight:500;padding:2px 8px;border-radius:6px;background:var(--ok-soft);color:var(--ok)}

/* draft preview */
.draft{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px}
.thumb{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em;max-width:100%}
.th-Post{background:linear-gradient(135deg,var(--accent),#F29E6B)} .th-Reel{background:linear-gradient(135deg,var(--violet),var(--accent))} .th-Story{background:linear-gradient(135deg,#2C9C8A,var(--violet))}
.th-Carousel,.th-Update,.th-Offer,.th-Event,.th-Ad,.th-Thread,.th-Broadcast{background:linear-gradient(135deg,var(--accent),#F29E6B)} .th-Video,.th-Short{background:linear-gradient(135deg,var(--violet),var(--accent))} .th-Status{background:linear-gradient(135deg,#2C9C8A,var(--violet))}
.ev-Carousel,.ev-Update,.ev-Offer,.ev-Event,.ev-Ad,.ev-Thread,.ev-Broadcast{background:var(--accent-soft);color:var(--accent)} .ev-Video,.ev-Short{background:var(--violet-soft);color:var(--violet)} .ev-Status{background:var(--info-soft);color:var(--info)}
.caption{white-space:pre-wrap;font-size:14px}
.feedback{font-size:13px;background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:8px 10px}

/* chat */
.chat{display:grid;grid-template-columns:260px minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface);min-height:460px}
.threads{border-right:1px solid var(--line);overflow:auto;max-height:560px}
.thread{display:grid;gap:2px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.thread[aria-current="true"]{background:var(--sunk)}
.thread small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.convo{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-width:0}
.convo .ch{padding:12px 16px;border-bottom:1px solid var(--line)}
.msgs{padding:16px;display:flex;flex-direction:column;gap:10px;overflow:auto;max-height:420px}
.msg{max-width:78%;display:grid;gap:2px}
.msg .bub{background:var(--sunk);padding:8px 12px;border-radius:12px 12px 12px 4px;font-size:14px;overflow-wrap:anywhere}
.msg.mine{align-self:flex-end}
.msg.mine .bub{background:var(--accent);color:var(--accent-ink);border-radius:12px 12px 4px 12px}
.msg small{font-size:11px;color:var(--muted)}
.msg.mine small{text-align:right}
.compose{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.compose input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}

/* calendar */
.calwrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(88px,1fr));gap:4px;min-width:640px}
.cal .dow{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:4px 6px}
.cal .day{min-height:96px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px;display:grid;align-content:start;gap:4px}
.cal .day.other{opacity:.45}
.cal .day.today{border-color:var(--accent)}
.cal .day .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.cal .ev{font-size:11px;font-weight:600;border-radius:5px;padding:2px 5px;border:0;text-align:left;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
/* ================= DATA ================= */
const ROLES={business:"Business",pro:"Social Media Manager",influencer:"Influencer",employee:"Employee"};
const roleTag=r=>({business:"t-biz",pro:"t-pro",influencer:"t-inf",employee:"t-emp"})[r]||"t-emp";
const INFCATS=["Food","Fitness","Fashion","Lifestyle","Travel","Tech"];
const CITIES=["Hyderabad","Bengaluru","Mumbai","Chennai","Pune"];
const DELIVERABLES=["Instagram Reel","Instagram Post","Story set","YouTube video"];
const SOCIALS={"Instagram":"#D63A6E","Facebook":"#2363B8","YouTube":"#C0392B","LinkedIn":"#0A66C2","X (Twitter)":"#17152B","Google Business":"#1D8A5B"};
const TEAM_URL="brandbay.in/team";
const STAGES=["Submitted","Research","Content","Live"];
const PLATFORMS=["Instagram","Facebook","YouTube","LinkedIn","X (Twitter)","Google Ads","WhatsApp"];
const SERVICES=["Market research","Content creation","Post scheduling","Paid ads","Reels / video","Influencer outreach","Competitor analysis","Community replies"];
const PACKAGES={Starter:{price:15000,desc:"8 posts a month, 1 platform, basic report"},Growth:{price:35000,desc:"16 posts + 4 reels, 2 platforms, ads setup, weekly report"},Pro:{price:75000,desc:"Daily content, all platforms, research, influencers, ads management"},Custom:{price:0,desc:"Set your own budget and scope"}};
const INDUSTRY_KEYS={"Food & Café":["food","lifestyle","restaurant"],"Fashion":["fashion","style","lifestyle"],"Fitness":["fitness","video","health"],"Real estate":["real estate","video","property"],"Education":["education","explainer","video"],"Salon & Beauty":["beauty","fashion","lifestyle"],"Other":["general"]};

const DAY=86400000;
const iso=(off=0)=>{const d=new Date(Date.now()+off*DAY);return d.toISOString().slice(0,10)};
const ts=(offMin=0)=>new Date(Date.now()+offMin*60000).toISOString();

/* ================= LIVE DATA (Supabase) ================= */
const SB_URL="https://wmyztofammiyhklyhyoa.supabase.co";
const SB_KEY="sb_publishable_X6eF6Arf--zYRG3xGmLKAQ_t0d21mdI";
// A password-reset email link opens the site with "type=recovery" in the address. Note it before Supabase reads and clears it.
const RECOVERY=/type=recovery/.test(location.hash);
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const blank=()=>({users:[],requests:[],drafts:[],messages:[],invoices:[],reviews:[],brandkits:{},socials:{},posts:[],bookings:[],notifs:[],activity:[],current:null});
let S=blank(),profile=null,booted=false,live=null;
const save=()=>{};
const dOnly=t=>t?String(t).slice(0,10):"";
const hm=t=>t?String(t).slice(0,5):"";
async function q(p){const {data,error}=await p;if(error)throw error;return data}
function friendly(e){const m=(e&&(e.message||e.error_description))||"";
  if(/row-level security|permission denied/i.test(m))return "You don't have permission to do that.";
  if(/Failed to fetch|NetworkError|network/i.test(m))return "Can't reach BrandBay right now. Check your internet and try again.";
  return m||"Something went wrong. Please try again."}
function mapProfile(p){return{id:p.id,name:p.name,email:p.email||"",phone:p.phone||"",role:p.role,status:p.status,company:p.company,industry:p.industry,address:p.address,handle:p.handle,followers:p.followers,rate:p.rate,bio:p.bio,niche:p.niche,category:p.category,city:p.city,dept:p.dept,joined:dOnly(p.created_at)}}

async function loadAll(){
  const uid=S.current;if(!uid){S=blank();return}
  const staff=profile&&profile.role==="employee"&&profile.status==="Active";
  const [people,camps,drafts,msgs,invs,revs,kits,socs,posts,bks,notifs,acts]=await Promise.all([
    q(sb.from(staff?"profiles":"directory").select("*")),
    q(sb.from("campaigns").select("*")),
    q(sb.from("drafts").select("*").order("id")),
    q(sb.from("messages").select("*").order("id")),
    q(sb.from("invoices").select("*")),
    q(sb.from("reviews").select("*")),
    q(sb.from("brand_kits").select("*")),
    q(sb.from("social_accounts").select("*")),
    q(sb.from("posts").select("*").order("id")),
    q(sb.from("bookings").select("*")),
    q(sb.from("notifications").select("*").order("id",{ascending:false}).limit(50)),
    q(sb.from("activity").select("*").order("id",{ascending:false}).limit(200))
  ]);
  const ref=new Map(camps.map(c=>[c.id,c.ref]));
  const N={...blank(),current:uid};
  N.users=people.map(mapProfile).filter(u=>u.id!==uid);
  if(profile)N.users.push(mapProfile(profile));
  N.requests=camps.map(c=>({id:c.ref,dbid:c.id,biz:c.business_id,pro:c.manager_id,title:c.title,goal:c.goal||"—",audience:c.audience||"",pkg:c.package,platforms:c.platforms||[],services:c.services||[],budget:c.budget,stage:c.stage,created:dOnly(c.created_at),deadline:c.deadline||dOnly(c.created_at),notes:c.notes||"",research:Object.assign({audience:"",competitors:"",hashtags:""},c.research||{})}));
  N.drafts=drafts.map(d=>({id:"D"+d.id,dbid:d.id,req:ref.get(d.campaign_id),pro:d.manager_id,type:d.type,platform:d.platform,caption:d.caption,hashtags:d.hashtags||"",date:d.post_date,status:d.status,feedback:d.feedback||""}));
  N.messages=msgs.map(m=>({req:ref.get(m.campaign_id),from:m.sender_id,text:m.body,at:m.created_at}));
  N.invoices=invs.map(i=>({id:i.ref,dbid:i.id,req:ref.get(i.campaign_id),biz:i.business_id,amount:i.amount,status:i.status,due:i.due}));
  N.reviews=revs.map(r=>({req:ref.get(r.campaign_id)||"",pro:r.manager_id,biz:r.business_id,stars:r.stars,text:r.body||"",at:dOnly(r.created_at)}));
  kits.forEach(k=>N.brandkits[k.business_id]={tone:k.tone||"Friendly",colors:(k.colors&&k.colors.length?k.colors:["#D63A6E","#17152B","#FFFFFF"]),hashtags:k.hashtags||"",audience:k.audience||"",dos:k.dos||"",donts:k.donts||""});
  socs.forEach(s=>{(N.socials[s.business_id]=N.socials[s.business_id]||{})[s.platform]=s.connected?{on:true,handle:s.handle||"",followers:s.followers||0,growth:s.growth||0}:{on:false}});
  N.posts=posts.map(p=>({id:"P"+p.id,dbid:p.id,biz:p.business_id,platform:p.platform,type:p.type,caption:p.caption,hashtags:p.hashtags||"",date:p.post_date,time:hm(p.post_time),status:p.status}));
  N.bookings=bks.map(b=>({id:b.ref,dbid:b.id,inf:b.influencer_id,biz:b.business_id,req:b.campaign_id?ref.get(b.campaign_id)||"":"",by:b.booked_by,date:b.shoot_date,time:hm(b.shoot_time),location:b.location,deliverable:b.deliverable,fee:b.fee,brief:b.brief||"",status:b.status,link:b.upload_link||"",path:b.upload_path||"",caption:b.caption||"",feedback:b.feedback||"",created:dOnly(b.created_at)}));
  N.notifs=notifs.map(n=>({dbid:n.id,to:n.user_id,text:n.body,link:n.link||"overview",at:n.created_at,read:n.read}));
  N.activity=acts.map(a=>({req:a.campaign_id?ref.get(a.campaign_id):undefined,by:a.actor_id,text:a.body,at:a.created_at}));
  S=N;
}
async function refresh(){try{await loadAll();render()}catch(e){console.error(e);toast(friendly(e))}}
/* run a write, reload everything, re-render. Returns true when it worked. */
async function run(fn,ok){try{await fn();await loadAll();if(ok)toast(ok);render();return true}catch(e){console.error(e);toast(friendly(e));return false}}

let liveT;
function startLive(){stopLive();live=sb.channel("brandbay-"+S.current)
  .on("postgres_changes",{event:"INSERT",schema:"public",table:"notifications",filter:"user_id=eq."+S.current},()=>{clearTimeout(liveT);liveT=setTimeout(refresh,400)})
  .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},()=>{clearTimeout(liveT);liveT=setTimeout(refresh,400)})
  .subscribe()}
function stopLive(){if(live){sb.removeChannel(live);live=null}}

async function startSession(uid){
  profile=await q(sb.from("profiles").select("*").eq("id",uid).single());
  S.current=uid;await loadAll();startLive();
}
async function endSession(){stopLive();await sb.auth.signOut();profile=null;S=blank()}

/* ================= HELPERS ================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const user=id=>id?(S.users.find(u=>u.id===id)||{id,name:"Former user",role:"",status:"",handle:"",company:"",email:""}):undefined;
const req=id=>S.requests.find(r=>r.id===id);
const me=()=>S.current?S.users.find(u=>u.id===S.current):undefined;
const rupee=n=>"₹"+Math.round(Number(n)||0).toLocaleString("en-IN");
const initials=n=>String(n||"?").split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase();
const fdate=d=>{const x=new Date(d);return x.toLocaleDateString("en-IN",{day:"numeric",month:"short"})};
const ago=t=>{const m=Math.round((Date.now()-new Date(t))/60000);if(m<1)return"just now";if(m<60)return m+" min ago";const h=Math.round(m/60);if(h<24)return h+" h ago";return Math.round(h/24)+" d ago"};
const bizName=id=>{const b=user(id);return b?(b.company||b.name):"—"};
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2400)}
function notify(){} /* notifications are created by the database */
function log(){}
const employees=()=>S.users.filter(u=>u.role==="employee").map(u=>u.id);
function rating(proId){const rs=S.reviews.filter(r=>r.pro===proId);return rs.length?(rs.reduce((a,r)=>a+r.stars,0)/rs.length):0}
const starStr=n=>"★".repeat(Math.round(n))+"☆".repeat(5-Math.round(n));
function myReqs(){const u=me();if(!u)return[];if(u.role==="business")return S.requests.filter(r=>r.biz===u.id);if(u.role==="pro")return S.requests.filter(r=>r.pro===u.id);if(u.role==="influencer")return[];return S.requests}
const bk=id=>S.bookings.find(b=>b.id===id);
function myBookings(){const u=me();if(!u)return[];if(u.role==="business")return S.bookings.filter(b=>b.biz===u.id);if(u.role==="influencer")return S.bookings.filter(b=>b.inf===u.id);if(u.role==="pro")return S.bookings.filter(b=>b.by===u.id||req(b.req)?.pro===u.id);return S.bookings}
function myPosts(){const u=me();if(!u)return[];if(u.role==="business")return S.posts.filter(p=>p.biz===u.id);if(u.role==="employee")return S.posts;return[]}
const bkRoute=id=>{const r=user(id)?.role;return r==="influencer"||r==="employee"?"bookings":"influencers"};
function notifyBk(ids,text){[].concat(ids).filter((v,i,a)=>v&&a.indexOf(v)===i).forEach(id=>notify(id,text,bkRoute(id)))}
function infRating(id){const done=S.bookings.filter(b=>b.inf===id&&b.status==="Approved").length;return Math.min(5,4.2+done*0.2)}
function canSee(r){const u=me();return u&&(u.role==="employee"||r.biz===u.id||r.pro===u.id)}
function matchScore(p,r){const keys=INDUSTRY_KEYS[user(r.biz)?.industry]||["general"];const n=(p.niche||"").toLowerCase();let s=55;keys.forEach(k=>{if(n.includes(k))s+=15});if(r.services.includes("Reels / video")&&n.includes("video"))s+=8;s+=Math.round(rating(p.id)*3);return Math.min(s,98)}
/* deterministic analytics per campaign */
function rng(seedStr){let h=2166136261;for(const c of seedStr)h=Math.imul(h^c.charCodeAt(0),16777619);return()=>{h=Math.imul(h^(h>>>15),2246822507);h=Math.imul(h^(h>>>13),3266489909);return((h^=h>>>16)>>>0)/4294967296}}
function analytics(r){return null; /* live stats arrive with the social media connection */
  if(r.stage!=="Content"&&r.stage!=="Live")return null;
  const R=rng(r.id),base=r.budget/12,days=14,reach=[];let v=base*(0.4+R()*0.3);
  for(let i=0;i<days;i++){v=v*(1.02+R()*0.12)*(r.stage==="Live"?1.02:1);reach.push(Math.round(v))}
  const total=reach.reduce((a,b)=>a+b,0);
  return{reach,total,followers:Math.round(total*0.012),engagement:(3+R()*4).toFixed(1),clicks:Math.round(total*0.018),leads:Math.round(total*0.0025)}
}

/* ================= CHARTS ================= */
function niceMax(m){if(m<=0)return 10;const p=Math.pow(10,Math.floor(Math.log10(m)));const n=m/p;return(n<=1?1:n<=2?2:n<=5?5:10)*p}
function lineChart(series,labels){
  const W=640,H=220,L=56,Rr=14,T=14,B=30,max=niceMax(Math.max(...series)),n=series.length;
  const x=i=>L+(W-L-Rr)*(n===1?0:i/(n-1)),y=v=>T+(H-T-B)*(1-v/max);
  const ticks=[0,.25,.5,.75,1].map(f=>f*max);
  const pts=series.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const area=`${L},${y(0)} ${pts} ${x(n-1)},${y(0)}`;
  const fmt=v=>v>=100000?(v/100000).toFixed(v%100000?1:0)+"L":v>=1000?(v/1000).toFixed(v%1000?1:0)+"K":Math.round(v);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart of daily reach">
    ${ticks.map(t=>`<line x1="${L}" x2="${W-Rr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="JetBrains Mono,monospace">${fmt(t)}</text>`).join("")}
    <polygon points="${area}" fill="var(--accent)" fill-opacity=".12"/>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${x(n-1)}" cy="${y(series[n-1])}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    ${labels.map((l,i)=>i%Math.ceil(n/7)===0||i===n-1?`<text x="${x(i)}" y="${H-8}" text-anchor="${i===0?"start":i===n-1?"end":"middle"}" font-size="11" fill="var(--muted)">${l}</text>`:"").join("")}
  </svg></div>`}
function bars(items,fmt=v=>v){const m=Math.max(1,...items.map(i=>i.value));return `<div class="list">${items.map(i=>`<div class="bar"><span>${esc(i.label)}</span><div class="track"><div class="fill" style="width:${(i.value/m*100).toFixed(1)}%;${i.color?`background:${i.color}`:""}"></div></div><b>${fmt(i.value)}</b></div>`).join("")}</div>`}
const dayLabels=n=>Array.from({length:n},(_,i)=>fdate(Date.now()-(n-1-i)*DAY));

let route=location.hash.slice(1)||"home";
const ui={campFilter:"All",reqSearch:"",reqStage:"All",userRole:"All",mkSearch:"",mkPlat:"All",mkMin:0,thread:null,calMonth:null,proTab:"active",showNotif:false,showMenu:false,search:"",draftFor:null,changesFor:null,stars:5,regRole:"business",gen:null,infCat:"All",infCity:"All",bookFor:null,bookReq:null,uploadFor:null,reshootFor:null};
function go(r){route=r;ui.showNotif=ui.showMenu=false;ui.search="";if(location.hash.slice(1)!==r)location.hash=r;render();window.scrollTo(0,0)}
window.addEventListener("hashchange",()=>{const r=location.hash.slice(1)||"home";if(r!==route){route=r;render()}});

const NAV={
  business:[["overview","Overview"],["social","Social accounts"],["planner","Post planner"],["campaigns","My campaigns"],["new","New request"],["influencers","Influencers"],["approvals","Approvals"],["calendar","Content calendar"],["messages","Messages"],["billing","Billing"],["brandkit","Brand kit"],["settings","Settings"]],
  pro:[["overview","Overview"],["market","Find campaigns"],["mywork","My campaigns"],["influencers","Influencers"],["studio","Caption helper"],["calendar","Content calendar"],["messages","Messages"],["earnings","Earnings"],["settings","Profile & reviews"]],
  influencer:[["overview","Overview"],["bookings","My shoots"],["calendar","Shoot calendar"],["earnings","Earnings"],["settings","Profile"]],

};
function navCount(k){const u=me();
  if(k==="approvals")return S.drafts.filter(d=>req(d.req)?.biz===u.id&&d.status==="Pending").length;
  if(k==="market")return S.requests.filter(r=>!r.pro).length;
  if(k==="match")return S.requests.filter(r=>!r.pro).length;
  if(k==="users")return S.users.filter(x=>x.status==="Unverified").length;
  if(k==="billing")return S.invoices.filter(i=>i.biz===u.id&&i.status==="Due").length;
  if(k==="influencers")return myBookings().filter(b=>b.status==="Uploaded").length;
  if(k==="bookings")return u.role==="influencer"?myBookings().filter(b=>b.status==="Requested"||b.status==="Reshoot").length:S.bookings.filter(b=>b.status==="Uploaded"||b.status==="Requested").length;
  return 0}

function searchResults(){
  const q=ui.search.toLowerCase().trim(),u=me();
  const camps=S.requests.filter(canSee).filter(r=>(r.title+" "+r.id+" "+bizName(r.biz)).toLowerCase().includes(q)).slice(0,6);
  const people=u.role==="employee"?S.users.filter(x=>(x.name+" "+(x.company||"")+" "+(x.handle||"")).toLowerCase().includes(q)).slice(0,5):[];
  const invs=S.invoices.filter(i=>u.role==="employee"||i.biz===u.id).filter(i=>i.id.toLowerCase().includes(q)).slice(0,4);
  if(!camps.length&&!people.length&&!invs.length)return `<div class="pop"><div class="empty">No matches for "${esc(ui.search)}"</div></div>`;
  return `<div class="pop">${camps.length?`<div class="hdr">Campaigns</div>`+camps.map(r=>`<button class="res" data-act="go" data-arg="c-${r.id}" type="button"><b>${esc(r.title)}</b> <span class="muted mono">${r.id}</span></button>`).join(""):""}
  ${people.length?`<div class="hdr">People</div>`+people.map(x=>`<button class="res" data-act="go" data-arg="users" type="button">${esc(x.name)} <span class="muted">· ${ROLES[x.role]}</span></button>`).join(""):""}
  ${invs.length?`<div class="hdr">Invoices</div>`+invs.map(i=>`<button class="res" data-act="go" data-arg="${u.role==="employee"?"revenue":"billing"}" type="button">${i.id} <span class="muted">· ${rupee(i.amount)} · ${i.status}</span></button>`).join(""):""}</div>`}

}

V.calendar=u=>{
  const base=ui.calMonth?new Date(ui.calMonth+"-01T00:00:00"):new Date();const y=base.getFullYear(),m=base.getMonth();
  const first=new Date(y,m,1),start=new Date(y,m,1-((first.getDay()+6)%7));
  const ds=S.drafts.filter(d=>{const r=req(d.req);return r&&canSee(r)&&d.status!=="Changes"});
  const ps=myPosts(),sh=myBookings().filter(b=>b.status!=="Declined"&&b.status!=="Cancelled");
  const cells=[];for(let i=0;i<42;i++){const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;cells.push({d,key,other:d.getMonth()!==m})}
  const today=iso(0);const mk=(dy,dm)=>{const d=new Date(y,m+dm,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`};
  return head("Content calendar",esc(first.toLocaleDateString("en-IN",{month:"long",year:"numeric"})),`<div class="actions"><button class="btn small" data-act="cal" data-arg="${mk(0,-1)}" type="button">← Prev</button><button class="btn small" data-act="cal" data-arg="" type="button">Today</button><button class="btn small" data-act="cal" data-arg="${mk(0,1)}" type="button">Next →</button></div>`)+
  `<div class="card"><div class="chips" style="margin-bottom:12px"><span class="chip ev-Post">Post</span><span class="chip ev-Reel">Reel</span><span class="chip ev-Story">Story</span><span class="chip ev-Own">Your own post</span><span class="chip ev-Shoot">Influencer shoot</span><span class="muted" style="font-size:13px">Pending drafts show with a dot</span></div><div class="calwrap"><div class="cal">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<div class="dow">${d}</div>`).join("")}
  ${cells.map(c=>`<div class="day ${c.other?"other":""} ${c.key===today?"today":""}"><span class="n">${c.d.getDate()}</span>${ds.filter(d=>d.date===c.key).map(d=>`<button class="ev ev-${d.type}" data-act="go" data-arg="c-${d.req}" type="button" title="${esc(d.caption)}">${d.status==="Pending"?"● ":""}${d.type} · ${esc(bizName(req(d.req).biz))}</button>`).join("")}${ps.filter(p=>p.date===c.key).map(p=>`<button class="ev ev-Own" data-act="go" data-arg="planner" type="button" title="${esc(p.caption)}">${p.time} ${esc(p.platform)}</button>`).join("")}${sh.filter(b=>b.date===c.key).map(b=>`<button class="ev ev-Shoot" data-act="go" data-arg="${bkRoute(S.current)}" type="button" title="${esc(b.location)}">🎬 ${b.time} ${esc(me().role==="influencer"?bizName(b.biz):user(b.inf).name.split(" ")[0])}</button>`).join("")}</div>`).join("")}</div></div></div>`};

/* ---- business: social accounts & planner ---- */
function socialsOf(id){if(!S.socials[id]){S.socials[id]={};Object.keys(SOCIALS).forEach(k=>S.socials[id][k]={on:false})}return S.socials[id]}
V.business_social=u=>{const so=socialsOf(u.id),on=Object.entries(so).filter(([k,v])=>v.on);
  const total=on.reduce((a,[k,v])=>a+v.followers,0),wk=on.reduce((a,[k,v])=>a+v.growth,0);
  const sched=myPosts().filter(p=>p.status==="Scheduled").length+S.drafts.filter(d=>req(d.req)?.biz===u.id&&d.status==="Approved"&&d.date>=iso(0)).length;
  return head("Social accounts","Manage all your social media from one place",`<button class="btn primary" data-act="go" data-arg="planner" type="button">Schedule a post</button>`)+
  `<div class="stats">${stat("Total followers",total.toLocaleString("en-IN"),`+${wk.toLocaleString("en-IN")} this week`)}${stat("Connected accounts",on.length+" / "+Object.keys(SOCIALS).length)}${stat("Posts scheduled",sched)}${stat("Influencer shoots",myBookings().filter(b=>b.status==="Accepted"||b.status==="Requested").length,"upcoming")}</div>
  <div class="card"><h3>Your accounts</h3><div class="social">${Object.keys(SOCIALS).map(k=>{const a=so[k]||{on:false};return `<div class="plat"><div class="row"><span class="pl-ic" style="background:${SOCIALS[k]}">${k[0]}</span><div style="min-width:0;flex:1"><b>${k}</b><div class="muted" style="font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${a.on?esc(a.handle):"Not connected"}</div></div><span class="status s-${a.on?"Connected":"Off"}">${a.on?"Connected":"Off"}</span></div>
    ${a.on?`<div><span class="big num">${a.followers.toLocaleString("en-IN")}</span> <span class="muted" style="font-size:13px">followers</span></div>${a.growth?`<span class="up">▲ ${a.growth} this week</span>`:`<span class="muted" style="font-size:12px">Entered by hand</span>`}
    <div class="actions"><button class="btn small" data-act="go" data-arg="planner" type="button">Post</button><button class="btn small ghost" data-act="disconnect" data-arg="${k}" type="button">Disconnect</button></div>`
    :(ui.connectFor===k?`<form data-form="social" data-arg="${k}" novalidate style="display:grid;gap:8px"><input class="inp" id="sc-handle" placeholder="${k} handle or page name"><input class="inp" id="sc-followers" type="number" min="0" placeholder="Current followers (optional)"><div class="err" id="scErr"></div><div class="actions"><button class="btn small primary" type="submit">Save</button><button class="btn small ghost" data-act="cancelconnect" type="button">Cancel</button></div></form>`
      :`<p class="muted" style="font-size:13px">Add your ${k} account so your manager and the team know where to post.</p><div class="actions"><button class="btn small primary" data-act="connect" data-arg="${k}" type="button">Add ${k}</button></div>`)}</div>`}).join("")}</div>
  <p class="muted" style="font-size:13px;margin-top:12px">Automatic posting and live follower numbers arrive in the next update, when BrandBay signs in to each platform. For now, accounts and follower counts are entered by hand.</p></div>
  ${on.length?`<div class="card"><h3>Followers by platform</h3>${bars(on.map(([k,v])=>({label:k,value:v.followers,color:SOCIALS[k]})),v=>v.toLocaleString("en-IN"))}</div>`:""}`};

V.business_planner=u=>{const so=socialsOf(u.id),on=Object.keys(so).filter(k=>so[k].on);
  const own=myPosts().map(p=>({...p,src:"You"})),fromMgr=S.drafts.filter(d=>req(d.req)?.biz===u.id&&d.status==="Approved").map(d=>({id:d.id,platform:d.platform,type:d.type,caption:d.caption,hashtags:d.hashtags,date:d.date,time:"—",status:d.date<iso(0)?"Posted":"Scheduled",src:user(d.pro)?.name||"Manager",mgr:true}));
  const all=[...own,...fromMgr].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));const up=all.filter(p=>p.status==="Scheduled"),past=all.filter(p=>p.status==="Posted").reverse();

   <div class="field"><label for="p-cap">Caption</label><textarea id="p-cap" placeholder="What do you want to say?"></textarea></div>
   <div class="field"><label for="p-tags">Hashtags</label><input id="p-tags" value="${esc(S.brandkits[u.id]?.hashtags||"")}"></div>
   <div class="err" id="pErr"></div><button class="btn primary" type="submit" style="width:100%">Schedule post</button>
   <p class="muted" style="font-size:12px;margin-top:8px">BrandBay keeps your schedule. Until automatic posting arrives, post it yourself at the scheduled time and mark it as posted.</p></form>`

function bookingItem(b){const u=me(),i=user(b.inf),mine=u.role!=="influencer";
  let act="";
  if(u.role==="influencer"){
    if(b.status==="Requested")act=`<div class="actions"><button class="btn small okb" data-act="bkaccept" data-arg="${b.id}" type="button">Accept shoot</button><button class="btn small badb" data-act="bkdecline" data-arg="${b.id}" type="button">Decline</button></div>`;
    else if(b.status==="Accepted"||b.status==="Reshoot")act=ui.uploadFor===b.id?`<form data-form="upload" data-arg="${b.id}" class="item" style="background:var(--surface)" novalidate><div class="field"><label for="up-link">Link to your video or post</label><input id="up-link" placeholder="https://instagram.com/reel/…"></div><div class="field"><label for="up-cap">Caption you used</label><input id="up-cap" placeholder="Caption with brand tag"></div><div class="field"><label for="up-file">Or attach the video file</label><input id="up-file" type="file" accept="video/*,image/*"></div><div class="err" id="upErr"></div><div class="actions"><button class="btn small primary" type="submit">Upload for review</button><button class="btn small ghost" data-act="cancelupload" type="button">Cancel</button></div></form>`
      :`<div class="actions"><button class="btn small primary" data-act="openupload" data-arg="${b.id}" type="button">${b.status==="Reshoot"?"Upload new version":"Upload content"}</button></div>`;
  }else{
    if(b.status==="Uploaded")act=ui.reshootFor===b.id?`<form data-form="reshoot" data-arg="${b.id}" class="actions" novalidate><input class="inp" id="rs-fb" placeholder="What should the influencer change?" style="flex:1;min-width:180px"><button class="btn small badb" type="submit">Send</button><button class="btn small ghost" data-act="cancelreshoot" type="button">Cancel</button></form>`

    else if(b.status==="Requested"||b.status==="Accepted")act=`<div class="actions"><button class="btn small" data-act="bkremind" data-arg="${b.id}" type="button">Send reminder</button><button class="btn small ghost" data-act="bkcancel" data-arg="${b.id}" type="button">Cancel booking</button></div>`;
  }
  return `<div class="item"><div class="hd"><div class="row" style="align-items:flex-start"><span class="av" style="cursor:default;background:linear-gradient(135deg,var(--ok),var(--violet))">${initials(u.role==="influencer"?bizName(b.biz):i.name)}</span><div><b>${b.deliverable} · ${esc(u.role==="influencer"?bizName(b.biz):i.name)}</b><div class="meta"><span class="mono">${b.id}</span>${u.role==="influencer"?"":`<span>${esc(i.handle)}</span><span>for ${esc(bizName(b.biz))}</span>`}${b.req?`<span>${esc(req(b.req)?.title||"")}</span>`:""}</div></div></div><span class="status s-${b.status}">${b.status==="Reshoot"?"Changes asked":b.status}</span></div>
  <div class="meta" style="color:var(--ink);font-size:14px"><span>📅 <b>${new Date(b.date).toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"})}, ${b.time}</b></span><span>📍 ${esc(b.location)}</span><span class="num">💰 ${rupee(b.fee)}</span></div>
  ${b.brief?`<div class="meta">Brief: ${esc(b.brief)}</div>`:""}
  ${b.link||b.path?`<div style="font-size:14px;display:grid;gap:4px">Uploaded:${b.link?` <a class="uplink" href="${esc(b.link)}" target="_blank" rel="noopener">${esc(b.link)}</a>`:""}${b.path?`<div><button class="btn small" data-act="openfile" data-arg="${esc(b.path)}" type="button">▶ Open video</button></div>`:""}${b.caption?`<div class="muted">“${esc(b.caption)}”</div>`:""}</div>`:""}

async function signInAs(email,password,errEl,team){
  const E=m=>{$(errEl).textContent=m};
  if(!email)return E(team?"Enter your work email.":"Enter your email.");
  if(!password)return E("Enter your password.");
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error)return E(/invalid login/i.test(error.message)?"Wrong email or password. Check and try again.":friendly(error));
  let p;try{p=await q(sb.from("profiles").select("*").eq("id",data.user.id).single())}catch(e){await sb.auth.signOut();return E(friendly(e))}
  if(team&&p.role!=="employee"){await sb.auth.signOut();return E("This email isn't a BrandBay team account. Businesses, managers and influencers log in on the main page.")}
  if(!team&&p.role==="employee"){await sb.auth.signOut();return E("Team members log in at the team link ("+TEAM_URL+"). Use 'team login' below.")}
  if(p.status==="Suspended"){await sb.auth.signOut();return E("This account is suspended. Contact the BrandBay team.")}
  await startSession(data.user.id);toast("Welcome, "+p.name.split(" ")[0]+"!");go("overview");
}

/* ---- event delegation ---- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");
  if(!t){if(!e.target.closest(".pop")&&!e.target.closest(".search")&&(ui.showNotif||ui.showMenu||ui.search)){ui.showNotif=ui.showMenu=false;if(!e.target.closest(".search"))ui.search="";renderTop()}return}
  const fn=A[t.dataset.act];if(fn){e.preventDefault();e.stopPropagation();fn(t.dataset.arg,t,e)}
});
document.addEventListener("submit",async e=>{const f=e.target.closest("[data-form]");if(!f)return;e.preventDefault();
  if(f.dataset.busy)return;f.dataset.busy="1";const btns=[...f.querySelectorAll("button[type=submit]")];btns.forEach(b=>b.disabled=true);
  try{await F[f.dataset.form]?.(f)}catch(err){console.error(err);toast(friendly(err))}finally{delete f.dataset.busy;btns.forEach(b=>{if(b.isConnected)b.disabled=false})}});
document.addEventListener("change",e=>{const t=e.target.closest("[data-change]");if(t)C[t.dataset.change]?.(t)});
let inputT;
document.addEventListener("input",e=>{const t=e.target.closest("[data-input]");if(!t)return;I[t.dataset.input](t);clearTimeout(inputT);inputT=setTimeout(()=>{const id=t.id,pos=t.selectionStart;render();const n=document.getElementById(id);if(n){n.focus();n.setSelectionRange(pos,pos)}},250)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(ui.showNotif||ui.showMenu||ui.search)){ui.showNotif=ui.showMenu=false;ui.search="";renderTop()}});

async function boot(){
  $("#app").innerHTML=`<div class="wrap"><div class="empty" style="margin:60px auto;max-width:420px">Loading BrandBay…</div></div>`;
  sb.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY")go("reset");else if(ev==="SIGNED_OUT"&&S.current){stopLive();S=blank();profile=null;render()}});
  try{const {data:{session}}=await sb.auth.getSession();
    if(session){try{await startSession(session.user.id)}catch(e){console.error(e);await sb.auth.signOut();S=blank();profile=null}}
  }catch(e){console.error(e);toast(friendly(e))}
  booted=true;
  if(RECOVERY){route="reset";try{history.replaceState(null,"",location.pathname+"#reset")}catch(e){}}
  else if(/access_token|error_description/.test(route)){route=S.current?"overview":"login";try{history.replaceState(null,"",location.pathname+"#"+route)}catch(e){}}
  render();
}
boot();
</script>
</body>
</html>
